<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PersonaTrail - Advanced Threat Actor Tracking System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        dark: { 900: '#0a0a0f', 800: '#12121a', 700: '#1a1a25', 600: '#252530' },
                        cyber: { blue: '#00d4ff', purple: '#a855f7', pink: '#ec4899', green: '#10b981', orange: '#f59e0b', red: '#ef4444' }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'gradient': 'gradient 8s ease infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        gradient: {
                            '0%, 100%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-20px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(-45deg, #0a0a0f, #12121a, #1a1a25, #0a0a0f); 
            background-size: 400% 400%; 
            animation: gradient 15s ease infinite; 
            color: #e2e8f0; 
            font-family: 'Inter', sans-serif; 
        }
        .glass { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); 
        }
        .glass-dark { 
            background: rgba(10, 10, 15, 0.7); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }
        .sidebar { 
            background: linear-gradient(180deg, rgba(10, 10, 15, 0.95) 0%, rgba(18, 18, 26, 0.95) 100%); 
            backdrop-filter: blur(20px); 
            border-right: 1px solid rgba(255, 255, 255, 0.05); 
        }
        .sidebar-item { 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            border-left: 3px solid transparent; 
            cursor: pointer; 
            position: relative;
            overflow: hidden;
        }
        .sidebar-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, rgba(0, 212, 255, 0.1), transparent);
            transition: width 0.3s ease;
        }
        .sidebar-item:hover::before { width: 100%; }
        .sidebar-item:hover { border-left-color: #00d4ff; background: rgba(0, 212, 255, 0.05); }
        .sidebar-item.active { border-left-color: #00d4ff; background: rgba(0, 212, 255, 0.1); }
        .card { 
            background: linear-gradient(135deg, rgba(26, 26, 37, 0.8) 0%, rgba(18, 18, 26, 0.8) 100%); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 16px; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.5), transparent);
        }
        .card:hover { 
            transform: translateY(-4px); 
            border-color: rgba(0, 212, 255, 0.3); 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 60px rgba(0, 212, 255, 0.1); 
        }
        .btn-primary { 
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%); 
            color: white; 
            font-weight: 600; 
            transition: all 0.3s ease; 
            position: relative;
            overflow: hidden;
        }
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }
        .btn-primary:hover::before { left: 100%; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4); }
        .btn-live { 
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); 
            color: white; 
            animation: pulse-live 2s infinite; 
        }
        @keyframes pulse-live { 
            0%, 100% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.5); } 
            50% { box-shadow: 0 0 40px rgba(239, 68, 68, 0.8); } 
        }
        .badge { 
            display: inline-flex; 
            align-items: center; 
            padding: 6px 14px; 
            border-radius: 20px; 
            font-size: 11px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
        }
        .badge-critical { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.5); }
        .badge-high { background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.5); }
        .badge-medium { background: rgba(0, 212, 255, 0.2); color: #00d4ff; border: 1px solid rgba(0, 212, 255, 0.5); }
        .badge-success { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.5); }
        .progress-bar { 
            height: 8px; 
            background: rgba(255, 255, 255, 0.05); 
            border-radius: 10px; 
            overflow: hidden; 
            position: relative;
        }
        .progress-fill { 
            height: 100%; 
            background: linear-gradient(90deg, #00d4ff, #a855f7); 
            border-radius: 10px; 
            position: relative;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .timeline-line { background: linear-gradient(to bottom, #00d4ff, #a855f7, #ec4899); }
        .timeline-dot { 
            width: 16px; 
            height: 16px; 
            border-radius: 50%; 
            background: #00d4ff; 
            border: 3px solid #0a0a0f; 
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.8); 
            animation: pulse-dot 2s infinite; 
        }
        @keyframes pulse-dot { 
            0%, 100% { box-shadow: 0 0 20px rgba(0, 212, 255, 0.8); } 
            50% { box-shadow: 0 0 40px rgba(0, 212, 255, 1); } 
        }
        #trustgraph { 
            background: radial-gradient(ellipse at center, rgba(0, 212, 255, 0.05) 0%, transparent 70%); 
            border-radius: 16px; 
            border: 1px solid rgba(0, 212, 255, 0.2); 
        }
        .live-indicator { 
            width: 10px; 
            height: 10px; 
            background: #10b981; 
            border-radius: 50%; 
            display: inline-block; 
            animation: blink 1.5s infinite; 
        }
        @keyframes blink { 
            0%, 100% { opacity: 1; box-shadow: 0 0 10px #10b981; } 
            50% { opacity: 0.3; box-shadow: 0 0 20px #10b981; } 
        }
        .stat-card { 
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1) 0%, rgba(168, 85, 247, 0.1) 100%); 
            border: 1px solid rgba(0, 212, 255, 0.2); 
        }
        .stat-card:hover { 
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.15) 0%, rgba(168, 85, 247, 0.15) 100%); 
        }
        .view-section { display: none; animation: fadeIn 0.5s ease; }
        .view-section.active { display: block; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .table-row { transition: all 0.3s ease; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .table-row:hover { background: rgba(0, 212, 255, 0.05); border-left: 3px solid #00d4ff; }
        .search-input { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            transition: all 0.3s ease; 
        }
        .search-input:focus { 
            background: rgba(255, 255, 255, 0.08); 
            border-color: #00d4ff; 
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2); 
            outline: none;
        }
        .tracking-step {
            border-left: 3px solid #00d4ff;
            padding-left: 20px;
            margin-bottom: 30px;
            position: relative;
        }
        .tracking-step::before {
            content: '';
            position: absolute;
            left: -10px;
            top: 0;
            width: 16px;
            height: 16px;
            background: #00d4ff;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.8);
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 212, 255, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 212, 255, 0.5); }
        .neon-text {
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.8), 0 0 20px rgba(0, 212, 255, 0.6), 0 0 30px rgba(0, 212, 255, 0.4);
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(0, 212, 255, 0.5);
            border-radius: 50%;
            animation: float-particle 15s infinite;
            pointer-events: none;
        }
        @keyframes float-particle {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translate(100px, -100px) scale(0); opacity: 0; }
        }
    </style>
</head>
<body class="relative">
    <div id="particles" class="fixed inset-0 pointer-events-none z-0"></div>

    <div class="flex h-screen relative z-10">
        <aside class="sidebar w-72 flex flex-col">
            <div class="p-8 border-b border-white/5">
                <div class="flex items-center space-x-4">
                    <div class="w-14 h-14 bg-gradient-to-br from-cyber-blue to-cyber-purple rounded-2xl flex items-center justify-center" style="box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);">
                        <i class="fas fa-fingerprint text-white text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="text-white font-bold text-xl tracking-wide neon-text">PersonaTrail</h1>
                        <p class="text-gray-400 text-xs mt-1 flex items-center">
                            <span class="live-indicator mr-2"></span>
                            NTRO Intelligence
                        </p>
                    </div>
                </div>
            </div>
            <nav class="flex-1 py-8 overflow-y-auto">
                <div class="px-6 mb-3"><p class="text-gray-500 text-xs font-semibold uppercase tracking-wider">Main Menu</p></div>
                <a class="sidebar-item active flex items-center px-6 py-4 text-white" onclick="showView('dashboard')">
                    <i class="fas fa-th-large w-6 mr-4 text-cyber-blue"></i><span class="font-medium">Dashboard</span>
                </a>
                <a class="sidebar-item flex items-center px-6 py-4 text-gray-400" onclick="showView('tracking')">
                    <i class="fas fa-route w-6 mr-4 text-cyber-purple"></i><span class="font-medium">Tracking Methodology</span>
                    <span class="ml-auto bg-cyber-purple text-white text-xs px-2 py-1 rounded-full font-bold">NEW</span>
                </a>
                <a class="sidebar-item flex items-center px-6 py-4 text-gray-400" onclick="showView('live-search')">
                    <i class="fas fa-search w-6 mr-4 text-cyber-pink"></i><span class="font-medium">Live Search</span>
                    <span class="ml-auto bg-cyber-red text-white text-xs px-2 py-1 rounded-full font-bold">LIVE</span>
                </a>
                <a class="sidebar-item flex items-center px-6 py-4 text-gray-400" onclick="showView('actors')">
                    <i class="fas fa-user-secret w-6 mr-4 text-cyber-orange"></i><span class="font-medium">Threat Actors</span>
                    <span class="ml-auto bg-cyber-purple/20 text-cyber-purple text-xs px-2 py-1 rounded-full font-bold">38</span>
                </a>
                <a class="sidebar-item flex items-center px-6 py-4 text-gray-400" onclick="showView('leaks')">
                    <i class="fas fa-bug w-6 mr-4 text-cyber-red"></i><span class="font-medium">LeakRadar</span>
                    <span class="ml-auto bg-cyber-red/20 text-cyber-red text-xs px-2 py-1 rounded-full font-bold">156</span>
                </a>
                <a class="sidebar-item flex items-center px-6 py-4 text-gray-400" onclick="showView('graph')">
                    <i class="fas fa-project-diagram w-6 mr-4 text-cyber-green"></i><span class="font-medium">TrustGraph</span>
                </a>
                <a class="sidebar-item flex items-center px-6 py-4 text-gray-400" onclick="showView('timeline')">
                    <i class="fas fa-clock w-6 mr-4 text-cyber-blue"></i><span class="font-medium">PersonaTrail</span>
                </a>
                <div class="px-6 mt-8 mb-3"><p class="text-gray-500 text-xs font-semibold uppercase tracking-wider">System</p></div>
                <a class="sidebar-item flex items-center px-6 py-4 text-gray-400" onclick="showView('audit')">
                    <i class="fas fa-history w-6 mr-4 text-cyber-purple"></i><span class="font-medium">Audit Trail</span>
                </a>
            </nav>
            <div class="p-6 border-t border-white/5">
                <div class="flex items-center space-x-3">
                    <div class="w-12 h-12 bg-gradient-to-br from-cyber-purple to-cyber-pink rounded-full flex items-center justify-center">
                        <span class="text-white font-bold">AN</span>
                    </div>
                    <div class="flex-1">
                        <p class="text-white text-sm font-semibold">Analyst</p>
                        <p class="text-gray-500 text-xs">Senior Investigator</p>
                    </div>
                    <i class="fas fa-ellipsis-v text-gray-500 cursor-pointer hover:text-white transition"></i>
                </div>
            </div>
        </aside>

        <div class="flex-1 flex flex-col overflow-hidden">
            <header class="glass-dark px-8 py-5 border-b border-white/5">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-3xl font-bold text-white neon-text" id="page-title">Dashboard Overview</h2>
                        <p class="text-gray-400 text-sm mt-1">Advanced dark web threat actor de-anonymization platform</p>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="flex items-center space-x-3 px-5 py-3 glass rounded-xl">
                            <span class="live-indicator"></span>
                            <span class="text-sm text-gray-300 font-medium">System Active</span>
                        </div>
                        <button class="btn-primary px-6 py-3 rounded-xl font-semibold text-sm" onclick="exportData()">
                            <i class="fas fa-download mr-2"></i>Export Report
                        </button>
                    </div>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto p-8" id="main-content"></main>
        </div>
    </div>

    <script>
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                container.appendChild(particle);
            }
        }
        createParticles();

        let currentView = 'dashboard';
        
        async function showView(view) {
            currentView = view;
            document.querySelectorAll('.sidebar-item').forEach(item => item.classList.remove('active'));
            event.target.closest('.sidebar-item').classList.add('active');
            
            const titles = {
                'dashboard': 'Dashboard Overview',
                'tracking': '6-Step Tracking Methodology',
                'live-search': 'Live Intelligence Search',
                'actors': 'Threat Actors Database',
                'leaks': 'LeakRadar - Infrastructure Leaks',
                'graph': 'TrustGraph - Network Analysis',
                'timeline': 'PersonaTrail - Migration Timeline',
                'audit': 'Audit Trail'
            };
            document.getElementById('page-title').textContent = titles[view];
            
            const content = document.getElementById('main-content');
            
            if (view === 'dashboard') await loadDashboard(content);
            else if (view === 'tracking') await loadTrackingMethodology(content);
            else if (view === 'live-search') await loadLiveSearch(content);
            else if (view === 'actors') await loadActors(content);
            else if (view === 'leaks') await loadLeaks(content);
            else if (view === 'graph') await loadGraph(content);
            else if (view === 'timeline') await loadTimeline(content);
            else if (view === 'audit') await loadAudit(content);
        }

        async function loadDashboard(container) {
            const res = await fetch('/api/dashboard');
            const data = await res.json();
            
            container.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                    <div class="card stat-card p-6">
                        <div class="flex items-center justify-between mb-4">
                            <div class="w-14 h-14 bg-gradient-to-br from-cyber-blue/20 to-cyber-blue/5 rounded-2xl flex items-center justify-center">
                                <i class="fas fa-satellite-dish text-cyber-blue text-2xl"></i>
                            </div>
                            <span class="badge badge-success"><i class="fas fa-arrow-up mr-1"></i>Live</span>
                        </div>
                        <p class="text-gray-400 text-sm mb-2">Active Scans</p>
                        <p class="text-4xl font-bold text-white mb-1">${data.stats.active_scans}</p>
                        <p class="text-gray-500 text-xs">${data.live_scans_today} scans today</p>
                    </div>
                    <div class="card stat-card p-6">
                        <div class="flex items-center justify-between mb-4">
                            <div class="w-14 h-14 bg-gradient-to-br from-cyber-purple/20 to-cyber-purple/5 rounded-2xl flex items-center justify-center">
                                <i class="fas fa-user-secret text-cyber-purple text-2xl"></i>
                            </div>
                            <span class="badge badge-critical"><i class="fas fa-exclamation-triangle mr-1"></i>5 High</span>
                        </div>
                        <p class="text-gray-400 text-sm mb-2">Actors Tracked</p>
                        <p class="text-4xl font-bold text-white mb-1">${data.stats.actors_tracked}</p>
                        <p class="text-gray-500 text-xs">Across 12 marketplaces</p>
                    </div>
                    <div class="card stat-card p-6">
                        <div class="flex items-center justify-between mb-4">
                            <div class="w-14 h-14 bg-gradient-to-br from-cyber-red/20 to-cyber-red/5 rounded-2xl flex items-center justify-center">
                                <i class="fas fa-bug text-cyber-red text-2xl"></i>
                            </div>
                            <span class="badge badge-critical"><i class="fas fa-fire mr-1"></i>23 Critical</span>
                        </div>
                        <p class="text-gray-400 text-sm mb-2">Infrastructure Leaks</p>
                        <p class="text-4xl font-bold text-white mb-1">${data.stats.infrastructure_leaks}</p>
                        <p class="text-gray-500 text-xs">Last 24 hours</p>
                    </div>
                    <div class="card stat-card p-6">
                        <div class="flex items-center justify-between mb-4">
                            <div class="w-14 h-14 bg-gradient-to-br from-cyber-green/20 to-cyber-green/5 rounded-2xl flex items-center justify-center">
                                <i class="fas fa-shield-alt text-cyber-green text-2xl"></i>
                            </div>
                            <span class="badge badge-success"><i class="fas fa-check mr-1"></i>High</span>
                        </div>
                        <p class="text-gray-400 text-sm mb-2">Avg Confidence</p>
                        <p class="text-4xl font-bold text-white mb-1">${data.stats.avg_confidence}%</p>
                        <p class="text-gray-500 text-xs">Attribution accuracy</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="card p-8">
                        <h3 class="text-xl font-bold text-white mb-6 flex items-center">
                            <i class="fas fa-shield-alt text-cyber-green mr-3"></i>
                            Attribution Confidence
                        </h3>
                        <div class="flex justify-center mb-6">
                            <div class="relative w-48 h-48">
                                <svg class="w-full h-full transform -rotate-90">
                                    <circle cx="96" cy="96" r="80" stroke="rgba(255,255,255,0.05)" stroke-width="16" fill="none"/>
                                    <circle cx="96" cy="96" r="80" stroke="url(#gradient)" stroke-width="16" fill="none" stroke-dasharray="502" stroke-dashoffset="40" stroke-linecap="round"/>
                                    <defs>
                                        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                            <stop offset="0%" style="stop-color:#00d4ff"/>
                                            <stop offset="100%" style="stop-color:#a855f7"/>
                                        </linearGradient>
                                    </defs>
                                </svg>
                                <div class="absolute inset-0 flex items-center justify-center">
                                    <div class="text-center">
                                        <span class="text-5xl font-bold neon-text text-cyber-blue">${data.confidence.score}%</span>
                                        <p class="text-gray-400 text-sm mt-2">Overall Score</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="space-y-4">
                            <div>
                                <div class="flex justify-between text-sm mb-2">
                                    <span class="text-gray-400">SSL Certificate</span>
                                    <span class="font-bold text-white">${data.confidence.breakdown.ssl_certificate}/40</span>
                                </div>
                                <div class="progress-bar"><div class="progress-fill" style="width: ${data.confidence.breakdown.ssl_certificate/40*100}%"></div></div>
                            </div>
                            <div>
                                <div class="flex justify-between text-sm mb-2">
                                    <span class="text-gray-400">Wallet Correlation</span>
                                    <span class="font-bold text-white">${data.confidence.breakdown.wallet_correlation}/30</span>
                                </div>
                                <div class="progress-bar"><div class="progress-fill" style="width: ${data.confidence.breakdown.wallet_correlation/30*100}%"></div></div>
                            </div>

                            <span class="text-sm text-gray-400">PGP Keys</span>
                        </div>
                        <div class="flex items-center">
                            <div class="w-4 h-4 rounded-full bg-cyber-red mr-2"></div>
                            <span class="text-sm text-gray-400">Infrastructure</span>
                        </div>
                    </div>
                </div>
            `;
            setTimeout(() => {
                const nodes = new vis.DataSet(data.nodes);
                const edges = new vis.DataSet(data.edges);
                new vis.Network(document.getElementById('trustgraph'), {nodes, edges}, {
                    nodes: {shape: 'dot', font: {size: 14, color: 'white'}, borderWidth: 3},
                    edges: {width: 2, color: {color: '#64748b'}, arrows: {to: {enabled: true}}},
                    physics: {forceAtlas2Based: {gravitationalConstant: -80}}
                });
            }, 100);
        }

        async function loadTimeline(container) {
            const res = await fetch('/api/timeline');
            const data = await res.json();
            container.innerHTML = `
                <div class="card p-8">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-xl font-bold text-white flex items-center">
                            <i class="fas fa-clock text-cyber-orange mr-3"></i>
                            PersonaTrail - Actor Migration Timeline
                        </h3>
                        <button class="btn-primary px-4 py-2 rounded-lg text-sm">
                            <i class="fas fa-file-export mr-2"></i>Export Timeline
                        </button>
                    </div>
                    <div class="relative pl-8">
                        <div class="absolute left-0 top-0 bottom-0 w-1 timeline-line rounded"></div>
                        ${data.timeline.map(item => `
                            <div class="mb-8 relative">
                                <div class="absolute -left-[29px] top-0 timeline-dot"></div>
                                <div class="ml-6">
                                    <div class="flex items-center mb-2">
                                        <span class="text-cyber-blue font-semibold text-sm">${item.date}</span>
                                        ${item.confidence ? `<span class="ml-3 badge badge-${item.confidence > 90 ? 'success' : item.confidence > 70 ? 'high' : 'medium'}">${item.confidence}% confidence</span>` : ''}
                                    </div>
                                    <p class="text-white font-semibold">${item.event}</p>
                                    <div class="mt-2 inline-block bg-dark-800 px-3 py-1 rounded text-xs text-gray-400">
                                        <i class="fas ${item.icon} mr-1"></i>${item.evidence}
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        async function loadAudit(container) {
            const res = await fetch('/api/audit-log');
            const data = await res.json();
            container.innerHTML = `
                <div class="card p-6">
                    <h3 class="text-xl font-bold text-white mb-6 flex items-center">
                        <i class="fas fa-history text-cyber-purple mr-3"></i>
                        Audit Trail - LEA Compliance
                    </h3>
                    <table class="w-full">
                        <thead>
                            <tr class="border-b border-white/10">
                                <th class="text-left py-3 px-4 text-gray-400 text-sm font-semibold">Timestamp</th>
                                <th class="text-left py-3 px-4 text-gray-400 text-sm font-semibold">User</th>
                                <th class="text-left py-3 px-4 text-gray-400 text-sm font-semibold">Action</th>
                                <th class="text-left py-3 px-4 text-gray-400 text-sm font-semibold">Target</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.audit_log.slice(-20).map(log => `
                                <tr class="table-row">
                                    <td class="py-3 px-4 text-gray-300 text-sm font-mono">${new Date(log.timestamp).toLocaleString()}</td>
                                    <td class="py-3 px-4 text-gray-300 text-sm">${log.user}</td>
                                    <td class="py-3 px-4 text-gray-300 text-sm">${log.action}</td>
                                    <td class="py-3 px-4 text-gray-300 text-sm font-mono">${log.target}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function exportData() { 
            window.open('/api/export/csv', '_blank'); 
        }

        document.addEventListener('DOMContentLoaded', () => showView('dashboard'));
    </script>
</body>
</html>
